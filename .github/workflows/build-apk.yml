name: Build Avani AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Setup Java JDK
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. Install dependencies
      - name: Install dependencies
        run: npm install

      # 5. Install Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 6. Build web app
      - name: Build web app
        run: npm run build

      # 7. Initialize Capacitor
      - name: Initialize Capacitor
        run: |
          npx cap init "Avani AI" "com.avani.ai" --web-dir dist

      # 8. Add Android platform
      - name: Add Android
        run: |
          npx cap add android

      # 9. Sync Android
      - name: Sync Android
        run: |
          npx cap sync android

      # 10. Fix Kotlin duplicate classes
      - name: Fix Kotlin Duplicate Classes
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          cat << 'EOF' >> android/build.gradle

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      eachDependency { DependencyResolveDetails details ->
                          if (details.requested.group == "org.jetbrains.kotlin" &&
                              (details.requested.name == "kotlin-stdlib-jdk7" ||
                               details.requested.name == "kotlin-stdlib-jdk8")) {
                              details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                          }
                      }
                  }
              }
          }
          EOF

      # 11. Build APK
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 12. Rename APK
      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Avani-AI.apk

      # 13. Create GitHub Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"

          gh release create "$TAG" \
            release/Avani-AI.apk \
            --title "Avani AI $TAG" \
            --notes "Avani AI APK release. Built automatically from the main branch." \
            --latest
