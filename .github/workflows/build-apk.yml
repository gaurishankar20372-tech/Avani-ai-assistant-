name: Build Avani AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Setup Java JDK 21
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          npm ci || npm install

      # 5. Build web app
      - name: Build web app
        run: |
          npm run build

      # 6. Initialize Capacitor & Android Platform
      - name: Initialize Capacitor & Android Platform
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Avani AI" "com.avani.ai" --web-dir dist
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      # 7. Configure Android Permissions & Audio Access for Avani AI
      - name: Configure Android Permissions
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            # Ensure microphone and audio permissions are declared
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST_FILE"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_FILE"
            fi

            # Enable cleartext traffic if needed for remote bridges
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST_FILE"
          fi

          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          cat << 'EOF' >> android/build.gradle

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      eachDependency { DependencyResolveDetails details ->
                          if (details.requested.group == "org.jetbrains.kotlin" &&
                              (details.requested.name == "kotlin-stdlib-jdk7" ||
                               details.requested.name == "kotlin-stdlib-jdk8")) {
                              details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                          }
                      }
                  }
              }
          }
          EOF

      # 8. Sync Android assets
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # 9. Build Android Debug APK
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 10. Prepare APK
      - name: Prepare APK
        run: |
          mkdir -p release
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release/Avani-AI.apk
          else
            find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release/Avani-AI.apk \;
          fi
          echo "Generated APK file details:"
          ls -lh release/Avani-AI.apk

      # 11. Upload APK as Workflow Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avani-AI-APK
          path: release/Avani-AI.apk
          retention-days: 30

      # 12. Create GitHub Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"

          gh release create "$TAG" \
            release/Avani-AI.apk \
            --title "Avani AI $TAG" \
            --notes "Avani AI APK release. Built automatically from the main branch via GitHub Actions." \
            --latest || echo "Release create step completed."
